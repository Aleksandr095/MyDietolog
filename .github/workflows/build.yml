name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk MyDietolog-2.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: MyDietolog-2.0.${{ github.run_number }}
          path: MyDietolog-*.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: MyDietolog 2.0.${{ github.run_number }}
          body: APK для установки на Android. Скачайте файл .apk ниже.
          files: MyDietolog-*.apk
